<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luxury Cards Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #FAFAFA;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 80px 40px;
      max-width: 820px;
      margin: 0 auto;
    }

    /* ── Slider context ────────────────────────────────── */
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
      width: 100%;
    }
    .slider-label {
      font-size: 20px;
      font-weight: 700;
      color: #1D1D1F;
    }
    .slider-label span { color: #FF3B30; }

    input[type=range] {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      background: #fff;
      border: 2px solid #FF3B30;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .tick-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #C7C7CC;
    }

    /* ── Big loss number ───────────────────────────────── */
    .loss-number {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: #FF3B30;
      font-feature-settings: 'tnum';
      margin-bottom: 8px;
    }
    .loss-sub {
      font-size: 18px;
      color: #AEAEB2;
      margin-bottom: 28px;
    }

    /* ── Scroll strip ──────────────────────────────────── */
    .scroll-wrapper {
      width: 100%;
      overflow: hidden;
      -webkit-mask: linear-gradient(90deg, transparent 0%, black 6%, black 94%, transparent 100%);
      mask: linear-gradient(90deg, transparent 0%, black 6%, black 94%, transparent 100%);
      margin-bottom: 24px;
    }

    @keyframes lux-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .scroll-track {
      display: flex;
      gap: 14px;
      width: max-content;
      padding: 4px 0;
      animation: lux-scroll 22s linear infinite;
    }

    /* ── Individual card ───────────────────────────────── */
    .lux-card {
      position: relative;
      width: 280px;
      height: 185px;
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .lux-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* gradient: dark on bottom-left so text is legible */
    .lux-card .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(0,0,0,0.08) 0%,
        rgba(0,0,0,0.55) 60%,
        rgba(0,0,0,0.72) 100%
      );
    }

    .lux-card .content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 18px 16px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .lux-card .count {
      font-size: 48px;
      font-weight: 900;
      color: #FF3B30;
      line-height: 1;
      letter-spacing: -0.04em;
      font-feature-settings: 'tnum';
      flex-shrink: 0;
    }

    .lux-card .label {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      line-height: 1.25;
      padding-bottom: 5px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    /* ── Hint text ─────────────────────────────────────── */
    .hint {
      font-size: 13px;
      color: #D1D1D6;
    }

    /* ── Responsive: always show 2 cards ──────────────── */
    @media (max-width: 640px) {
      body { padding-left: 20px; padding-right: 20px; }
      .scroll-wrapper {
        -webkit-mask: linear-gradient(90deg, transparent 0%, black 3%, black 97%, transparent 100%);
        mask: linear-gradient(90deg, transparent 0%, black 3%, black 97%, transparent 100%);
      }
      .lux-card { width: 155px; height: 130px; }
      .lux-card .count { font-size: 30px; }
      .lux-card .label { font-size: 11px; }
      .lux-card .content { padding: 8px 10px 10px; gap: 4px; }
    }
  </style>
</head>
<body>

  <!-- Slider -->
  <div class="slider-row">
    <div class="slider-label">You manage <span id="count-label">50</span> contracts.</div>
    <input type="range" id="slider" min="0" max="300" value="50" step="1">
    <div class="tick-row">
      <span>0</span><span>50</span><span>100</span><span>150</span><span>200</span><span>250</span><span>300</span>
    </div>
  </div>

  <!-- Big loss number -->
  <div class="loss-number" id="loss-num">RM 75,000</div>
  <p class="loss-sub">in missed renewals per year.</p>

  <!-- Scroll strip -->
  <div class="scroll-wrapper">
    <div class="scroll-track" id="track"></div>
  </div>

  <p class="hint">50% untracked renewals &middot; RM 3,000 average commission &middot; drag to see your number</p>

  <script>
    const ITEMS = [
      {
        photo: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=560&h=370&fit=crop&auto=format",
        label: "branded bags",
        calc: l => Math.floor(l / 8000)
      },
      {
        photo: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=560&h=370&fit=crop&auto=format",
        label: "Japan trips",
        calc: l => Math.floor(l / 10000)
      },
      {
        photo: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=560&h=370&fit=crop&auto=format",
        label: "house installments",
        calc: l => Math.floor(l / 5000)
      },
      {
        photo: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=560&h=370&fit=crop&auto=format",
        label: "luxury car",
        calc: l => (l / 200000).toFixed(1)
      },
    ];

    const track = document.getElementById('track');
    const slider = document.getElementById('slider');
    const countLabel = document.getElementById('count-label');
    const lossNum = document.getElementById('loss-num');

    // Build cards (doubled for infinite loop)
    const allItems = [...ITEMS, ...ITEMS];
    const countEls = [];

    allItems.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'lux-card';

      const countEl = document.createElement('div');
      countEl.className = 'count';
      countEl.dataset.idx = i % ITEMS.length;

      card.innerHTML = `
        <img src="${item.photo}" alt="" loading="lazy">
        <div class="overlay"></div>
      `;
      const content = document.createElement('div');
      content.className = 'content';
      content.appendChild(countEl);

      const labelEl = document.createElement('div');
      labelEl.className = 'label';
      labelEl.textContent = item.label;
      content.appendChild(labelEl);

      card.appendChild(content);
      track.appendChild(card);
      countEls.push({ el: countEl, item });
    });

    function updateSlider() {
      const contracts = +slider.value;
      const loss = Math.round(contracts * 0.5 * 3000);
      const pct = (contracts / 300 * 100).toFixed(1) + '%';

      countLabel.textContent = contracts;
      lossNum.textContent = 'RM ' + loss.toLocaleString();
      slider.style.background = `linear-gradient(90deg, #FF3B30 ${pct}, #E5E5EA ${pct})`;

      countEls.forEach(({ el, item }) => {
        el.textContent = item.calc(loss);
      });
    }

    slider.addEventListener('input', updateSlider);
    updateSlider();
  </script>
</body>
</html>
